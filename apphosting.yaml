# Firebase App Hosting configuration
#
# Region: asia-southeast1 (immovable once created — confirmed with Derek per G1/G2)
# minInstances: 1 (prevents cold-start delays on SPIKE-DEPLOY; required for SSE testing)
# Secret Manager bindings: API keys are NEVER literal — only Secret Manager references
#   (T-01-24 mitigation: no literal secret values in this file)
#
# References:
#   - SPIKE-DEPLOY: this config deploys the SSE spike endpoint to App Hosting
#   - TSD §10: deployment config, Secret Manager bindings, minInstances=1
#   - 01-PROVISIONING.md: App Hosting backend created in asia-southeast1

runConfig:
  # Minimum live instances — prevents cold-start delays on real 4G testing (SPIKE-DEPLOY).
  # Also required for production: cold-start on SSE requests causes the first token to arrive
  # late (perceived as "no response" on mobile). minInstances=1 keeps one warm instance.
  minInstances: 1
  # Memory and CPU — defaults are sufficient for Phase 1 spike workloads.
  # Adjust in later phases as load profiles are known.
  # memory: "512Mi"
  # cpu: 1
  # concurrency: 80

# ── Environment variables and Secret Manager bindings ────────────────────────
# NEVER put literal secret values here.  All sensitive values reference Secret Manager.
# The App Hosting service account must have roles/secretmanager.secretAccessor
# on each secret.
#
# Format:
#   - variable: <ENV_VAR_NAME>
#     secret: <secret-resource-name>   # references Secret Manager; App Hosting resolves at deploy
#
# Non-sensitive values (project config, public URLs) may use value: directly.
# Model IDs are resolved from Remote Config at runtime — NOT from env (model-agnostic constraint).

env:
  # ── Anthropic (Claude via Vercel AI SDK) ──
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY  # Secret Manager resource: projects/<PROJECT_ID>/secrets/ANTHROPIC_API_KEY

  # ── Gemini embeddings (gemini-embedding-001, 1024-d) via @ai-sdk/google ──
  # Gemini Developer API (NOT Vertex AI — honors the no-GCP-beyond-Firebase constraint).
  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY  # Secret Manager: projects/<PROJECT_ID>/secrets/GOOGLE_GENERATIVE_AI_API_KEY

  # ── Scheduled jobs: NONE. Periodic work (stall-detect, escalate, eval-nightly,
  #    usage-rollup) runs as an on-visit lazy-cron Server Action guarded by a
  #    Firestore last-run-per-window check. No QStash, no Cloud Scheduler/Functions. ──

  # ── Firebase Admin SDK (service account — only if not using attached service account) ──
  # Prefer attached service account (GOOGLE_APPLICATION_CREDENTIALS is auto-set on App Hosting).
  # Uncomment if an explicit service-account JSON is needed:
  # - variable: FIREBASE_SERVICE_ACCOUNT_KEY
  #   secret: FIREBASE_SERVICE_ACCOUNT_KEY

  # ── App configuration (non-sensitive) ──
  - variable: FIREBASE_PROJECT_ID
    value: $(env:FIREBASE_PROJECT_ID)  # Set via App Hosting environment; not a secret

  - variable: FIREBASE_LOCATION
    value: asia-southeast1  # Immovable — do not change after resource creation

  - variable: TENANT_ID
    value: d2  # Single-tenant; future: parameterize for multi-tenancy

  - variable: NEXT_PUBLIC_APP_URL
    value: $(env:NEXT_PUBLIC_APP_URL)  # App Hosting sets this automatically
