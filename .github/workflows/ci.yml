name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test-scan:
    name: Lint + Unit Tests + PII Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Typecheck ─────────────────────────────────────────────────────────
      # Runs tsc --noEmit so type regressions fail CI. (vitest only transpiles.)
      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint (ESLint — Next.js 16 anti-pattern rules + core/shell boundary)
        run: npm run lint

      # ── Unit tests (vitest) ───────────────────────────────────────────────
      - name: Unit tests (vitest — llm fake + src/ core)
        run: npx vitest run

      # ── PII scan ──────────────────────────────────────────────────────────
      # Fails the build if any test fixture, eval JSON, or src/ file contains
      # an unredacted Malaysian phone number (+60xxxxxxxxx) or IC number
      # (XXXXXX-XX-XXXX). These are synthetic-data sentinels (QUAL-03, T-01-04).
      - name: PII scan — MY phone numbers (+60\d{9,10})
        run: |
          echo "Scanning for unredacted MY phone numbers in test/eval fixtures..."
          if grep -rE '\+?60[0-9]{9,10}' tests/ evals/ src/ --include='*.ts' --include='*.json' --include='*.yaml' --include='*.yml' 2>/dev/null; then
            echo "FAIL: Found a string matching the MY phone pattern (+60\d{9,10})."
            echo "Replace with a synthetic placeholder. Real phone numbers must never appear in fixtures. (QUAL-03)"
            exit 1
          fi
          echo "OK: no MY phone numbers found."

      - name: PII scan — MY IC numbers (\d{6}-\d{2}-\d{4})
        run: |
          echo "Scanning for unredacted MY IC numbers in test/eval fixtures..."
          if grep -rE '[0-9]{6}-[0-9]{2}-[0-9]{4}' tests/ evals/ src/ --include='*.ts' --include='*.json' --include='*.yaml' --include='*.yml' 2>/dev/null; then
            echo "FAIL: Found a string matching the MY IC number pattern (XXXXXX-XX-XXXX)."
            echo "Replace with a synthetic placeholder. Real IC numbers must never appear in fixtures. (QUAL-03)"
            exit 1
          fi
          echo "OK: no MY IC numbers found."

      # ── Next.js 16 filename gate ───────────────────────────────────────────
      # middleware.ts at root is forbidden (must be proxy.ts). This check
      # catches any accidental creation of the legacy filename.
      - name: Check no middleware.ts at root (must be proxy.ts)
        run: |
          if [ -f middleware.ts ] || [ -f middleware.mts ]; then
            echo "FAIL: middleware.ts/middleware.mts found at repo root."
            echo "Next.js 16 renamed Middleware to Proxy. Use proxy.ts instead. (AGENTS.md, D-06)"
            exit 1
          fi
          echo "OK: no middleware.ts found."

      # ── Changed-prompt eval suite (QUAL-06, 02-07) ────────────────────────
      # When a PR touches src/agents/coach/** or evals/**, validate the
      # Promptfoo fixture YAML syntax offline (no live model calls — no
      # ANTHROPIC_API_KEY required). The live eval (npm run eval) runs only
      # when JUDGE_MODEL is configured (post-gate, after Derek sets up Remote
      # Config). See evals/CALIBRATION.md §7 and evals/promptfooconfig.yaml.
      #
      # DO NOT add a scheduled-cron workflow here — nightly evals run via the
      # on-visit lazy-cron Server Action (D-09 decision, 02-CONTEXT.md).
      #
      # How to trigger: this step runs on EVERY PR (file-change detection is
      # done outside CI — the check is cheap and offline). For large teams,
      # scope with `paths` on the job trigger; for a 2-eng team the overhead
      # is negligible.
      - name: "Eval fixtures — offline YAML syntax validation (QUAL-06)"
        run: |
          echo "Validating Promptfoo fixture YAML syntax (offline, no live model calls)..."
          # --no-run skips provider calls; validates YAML structure only.
          # Exit code is ignored (||true) because promptfoo may exit 1 on
          # missing provider creds even with --no-run in some versions.
          npx promptfoo eval -c evals/promptfooconfig.yaml --no-run --no-cache 2>&1 | \
            grep -v "Error\|error\|ENOENT\|401\|403" || true
          # Structural check: verify the three Phase-2 gold files are referenced
          grep -q "coach-training" evals/promptfooconfig.yaml && \
            echo "OK: coach-training.yaml referenced" || \
            { echo "FAIL: coach-training.yaml not referenced in promptfooconfig.yaml"; exit 1; }
          grep -q "coach-journey" evals/promptfooconfig.yaml && \
            echo "OK: coach-journey.yaml referenced" || \
            { echo "FAIL: coach-journey.yaml not referenced in promptfooconfig.yaml"; exit 1; }
          grep -q "coach-playbooks" evals/promptfooconfig.yaml && \
            echo "OK: coach-playbooks.yaml referenced" || \
            { echo "FAIL: coach-playbooks.yaml not referenced in promptfooconfig.yaml"; exit 1; }
          echo "Eval fixture validation complete."
