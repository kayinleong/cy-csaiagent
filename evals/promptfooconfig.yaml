# evals/promptfooconfig.yaml — Promptfoo evaluation suite for D2 Coach
#
# Phase 2 / QUAL-06: expanded from the P1 single-fixture to a full Coach regression
# suite: training Q&A, journey prompts, and channel playbooks × EN / BM / ZH.
#
# Judge model: resolved from Firebase Remote Config at eval runtime via the
# JUDGE_MODEL environment variable. Set by Derek's eval runner script before
# invoking this config. NEVER hard-code a model ID here.
#
# To run (requires live Anthropic key + JUDGE_MODEL set from Remote Config):
#   JUDGE_MODEL=$(firebase remoteconfig:get --key model.grader.default) \
#     npx promptfoo eval -c evals/promptfooconfig.yaml
#
# Offline fixture validation only (no live model calls — validates YAML syntax):
#   npx promptfoo eval -c evals/promptfooconfig.yaml --no-cache || true
#
# Changed-prompt CI trigger: the GitHub Actions CI job (ci.yml) documents that
# any PR touching src/agents/coach/** or evals/** should run:
#   npm run eval:offline   (see package.json — validates fixture syntax, no live calls)
# The live eval (npm run eval) requires ANTHROPIC_API_KEY + JUDGE_MODEL and
# runs only when those are set (post-gate). See evals/CALIBRATION.md §7.
#
# DO NOT add a scheduled-cron GitHub Actions workflow for the nightly run —
# the nightly eval runs via the on-visit lazy-cron Server Action (D-09 decision,
# 02-CONTEXT.md). The CI changed-prompt suite is separate from the nightly run.
#
# See evals/CALIBRATION.md for the human-calibration protocol.
# See src/eval/judge.ts for the six-domain rubric definition (Phase 2).
#
# @see https://www.promptfoo.dev/docs/configuration/guide/

description: 'D2 CS-AI Agent — Coach + Finder + Router eval suite (Phase 2/3, QUAL-06, 02-07, 03-09)'

# ─── Providers ───────────────────────────────────────────────────────────────
# The Coach provider sends the test message to the live /api/chat endpoint.
# The endpoint itself resolves the Coach model from Remote Config — no model ID here.
#
# For offline / CI runs where no live server is available, use --no-run flag:
#   npx promptfoo eval -c evals/promptfooconfig.yaml --no-cache --no-run
providers:
  - id: "http"
    config:
      url: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}/api/chat"
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${E2E_ID_TOKEN}"
      body:
        messages:
          - role: "user"
            content: "{{user_message}}"
        cid: "eval-cid-{{lang}}-{{$index}}"

# ─── Judge (LLM rubric) ───────────────────────────────────────────────────────
# The judge model ID is provided via the JUDGE_MODEL env var, which is set from
# Firebase Remote Config (key: model.grader.default). This satisfies the
# model-agnostic constraint (TSD §2.3, CLAUDE.md).
#
# NEVER replace {{env.JUDGE_MODEL}} with a hard-coded model string.
#
# Phase 2 rubric: six domains — grounding, scope, language-match, voice,
# hallucination, and tone-drift. Defined in src/eval/judge.ts (combinedJudgeRubric).
defaultTest:
  options:
    provider: "anthropic:messages:{{env.JUDGE_MODEL}}"

# ─── Test suites ─────────────────────────────────────────────────────────────
# Phase 1 (seed) + Phase 2 regression suite (02-07, QUAL-06)
tests:
  # Phase 1 — original proof-slice (three languages, onboarding week-1 question)
  - evals/coach-trilingual.gold.yaml

  # Phase 2 — Coach regression suite (training Q&A × EN/BM/ZH)
  - evals/gold/coach-training.yaml

  # Phase 2 — Journey prompts (day-one pairing + comprehension gate × EN/BM/ZH)
  - evals/gold/coach-journey.yaml

  # Phase 2 — Playbook prompts (Meta Ads playbook + first-Meta-ad walkthrough × EN/BM/ZH)
  - evals/gold/coach-playbooks.yaml

  # ─── Phase 3 — Finder + Router suites (03-09, FIND-09/FIND-11) ──────────────
  #
  # These suites are LIVE-PILOT-GATED: they require a live Gemini/Firestore
  # inventory with real D2 projects seeded, plus the Opus judge. Do NOT run
  # offline — the grounding / segmentation / routing assertions only pass when
  # the Finder agent has real inventory to search against.
  #
  # Pre-run checklist (operator):
  #   1. Seed D2 inventory via the admin inventory app (03-08).
  #   2. Include a sold_out project matching the Cheras 3-bed RM650k criteria.
  #   3. Include a foreignEligible=false project in PJ RM1.2M range.
  #   4. Confirm JUDGE_MODEL env var is set from Remote Config (model.grader.default).
  #   5. Confirm model.router.default + model.finder.default are seeded in Remote Config.
  #
  # To run ONLY the Phase-3 suites:
  #   JUDGE_MODEL=$(firebase remoteconfig:get --key model.grader.default) \
  #     npx promptfoo eval -c evals/promptfooconfig.yaml \
  #     --filter-pattern "finder|router"

  # Finder grounding: sold-out refusal + foreign-eligibility + no-match (× EN/BM/ZH)
  - evals/gold/finder-grounding.yaml

  # Finder segmentation: investment vs own_stay same surface criteria → different top-3 (× EN/BM/ZH)
  - evals/gold/finder-segmentation.yaml

  # Router precision: clear-coach / clear-finder / ambiguous→coach safe-default (× EN/BM/ZH)
  - evals/gold/router-precision.yaml

  # ─── Phase 4 — Reply Assistant suites (04-01 Wave 0, REPLY-05/06/07) ─────────
  #
  # LIVE-GATED: require ANTHROPIC_API_KEY + JUDGE_MODEL (from Remote Config) + seeded
  # reply SOPs (pillar:'reply', categories cold-prospect / objection-handling / financing)
  # plus the curated org-voice doc (pillar:'reply', category:'voice'). DO NOT run offline.
  # The Reply judge rubric (voiceMatch / qualifyingQuestions / noAutoPitch) is added to
  # src/eval/judge.ts in a later Phase-4 wave (D-13). All prompts are SYNTHETIC (no PII).
  #
  # To run ONLY the Reply suites:
  #   JUDGE_MODEL=$(firebase remoteconfig:get --key model.grader.default) \
  #     npx promptfoo eval -c evals/promptfooconfig.yaml --filter-pattern "reply"

  # Reply cold-prospect: qualifying-questions framework, not a pitch (REPLY-05) (EN)
  - evals/gold/reply-cold-prospect.yaml

  # Reply objection-handling: price / competitor / timing reframes, grounded (REPLY-06) (EN)
  - evals/gold/reply-objection.yaml

  # Reply financing: D2 financing SOP, defer rates/eligibility to bank (REPLY-07) (EN)
  - evals/gold/reply-financing.yaml

# ─── Shared LLM-rubric assertion ─────────────────────────────────────────────
# Applied on top of fixture-level assertions via Promptfoo's defaultTest.
# The full six-domain rubric is defined in src/eval/judge.ts (combinedJudgeRubric).
# Each fixture also carries its own structural assertions (contains, javascript)
# that run offline without a live model call.
