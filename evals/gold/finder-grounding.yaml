# evals/gold/finder-grounding.yaml — Finder grounding gold set (Phase 3, FIND-09/FIND-11)
#
# Covers three grounding failure modes across EN / BM / ZH:
#
#   (a) sold-out / hidden project — a query semantically matching a sold_out or
#       hidden project must yield a grounded refusal-with-alternative, never that
#       project. (D-03 active-only enforcement; Pitfall 1; T-03-33)
#
#   (b) foreign-buyer eligibility — a foreign buyer querying a project that is
#       NOT foreignEligible must receive a grounded refusal AND defer legal
#       thresholds to D2 sales admin (never invent % ownership rules).
#       (Pitfall 5; T-03-34; FIND-09)
#
#   (c) no-match / sub-threshold — a lead whose criteria find no active projects
#       must receive a grounded refusal, no invented project. (D-05 grounded
#       refusal over forcing a match; SC3)
#
# All prompts are SYNTHETIC — no real PII, real IC, real phone numbers.
#
# Run gate: LIVE-PILOT-GATED — requires live Gemini/Firestore inventory + judge.
# DO NOT run offline (inventory must have real D2 projects to score correctly).
#
# Reference: FIND-09, SC1/SC3, Pitfall 1/4/5, 03-09-PLAN.md Task 1,
#            evals/CALIBRATION.md §8, src/agents/finder/tools.ts searchProjects

# ─── Case A: sold-out refusal ─────────────────────────────────────────────────
# A query that perfectly matches a known sold-out project must NEVER yield that
# project. The Finder must deliver a grounded refusal-with-alternative.

- description: "Finder | EN | sold-out refusal | lead matches a sold_out project"
  live_pilot_gated: true
  vars:
    lang: en
    segment: own_stay
    user_message: |
      My lead is interested in a 3-bedroom unit in Cheras, budget RM650k, Malaysian,
      non-bumi. Please find a match for this lead.
    # Seed note (operator): ensure the Firestore test inventory includes one
    # project with matching criteria AND status=sold_out. The Finder MUST NOT
    # return it. A synthetic project ID is used (e.g. "proj-cheras-soldout-01").
    expected_behavior: >
      Responds in English. Does NOT recommend the sold_out project. Either
      surfaces an alternative active project with grounded rationale, or delivers
      a grounded no-match refusal explaining no active projects meet the criteria.
      Must NOT invent a project ID. Must cite the active-only enforcement.
    native_review_required: false
  assert:
    - type: not-contains
      value: "sold_out"
      description: "Response must NOT contain the string sold_out (no leaking hidden status)"
    - type: javascript
      value: |
        // Active-only gate: response must not recommend a project the Finder
        // would have filtered (sold-out). Look for the refusal or alternative signal.
        const refusalSignals = /no active|no match|grounded|alternative|only active|currently unavailable|not available/i;
        const projectMatch = /\[PROJ:[a-z0-9-]+\]/.test(output);
        // If a project is cited, it must not be labeled sold-out
        if (projectMatch) {
          return !output.includes('sold_out') && !output.toLowerCase().includes('sold out');
        }
        // If no project cited, a refusal signal must be present
        return refusalSignals.test(output);
      description: "Active-only gate: no sold-out recommendation; refusal or alternative required"
    - type: not-contains
      value: "Certainly"
      description: "No AI-tell filler (Certainly!)"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"
    - type: javascript
      value: |
        const IC = /\d{6}-\d{2}-\d{4}/;
        return !IC.test(output);
      description: "PII gate: no real MY IC numbers"

- description: "Finder | MS | sold-out refusal | bajet RM650k projek terjual habis"
  live_pilot_gated: true
  vars:
    lang: ms
    segment: own_stay
    user_message: |
      Lead saya berminat unit 3 bilik tidur di Cheras, bajet RM650k, rakyat Malaysia,
      bukan bumi. Tolong cari projek yang sesuai.
    expected_behavior: >
      Responds in Bahasa Malaysia. Does NOT recommend the sold_out project.
      Provides grounded refusal or alternative active project. No invented project.
    native_review_required: true
    native_review_status: "PENDING — requires native BM speaker review (D-08)"
  assert:
    - type: javascript
      value: |
        const bmIndicators = /\b(dan|atau|untuk|dalam|projek|tidak|maaf|tiada|aktif|tersedia|alternatif)\b/i;
        return bmIndicators.test(output);
      description: "Language-match: response is in Bahasa Malaysia"
    - type: javascript
      value: |
        return !output.includes('sold_out') && !output.toLowerCase().includes('terjual habis sudah');
      description: "Active-only gate: no sold-out project recommended"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"

