# ─── Case B: foreign-buyer eligibility deferral ───────────────────────────────
# A foreign buyer against a foreignEligible=false project must receive a grounded
# refusal AND defer legal thresholds to D2 sales admin (never invent %).
# Pitfall 5 / T-03-34.

- description: "Finder | EN | foreign-eligibility | foreign buyer vs non-eligible project"
  live_pilot_gated: true
  vars:
    lang: en
    segment: investment
    user_message: |
      My lead is a Singaporean investor looking for a 2-bedroom unit in Petaling Jaya,
      budget RM1.2M. Please find matching projects.
    # Seed note (operator): ensure test inventory has a project with
    # foreignEligible=false in the RM1.2M range in PJ. The Finder must refuse it.
    expected_behavior: >
      Responds in English. Detects lead is foreign buyer. Does NOT recommend a
      foreignEligible=false project. Delivers a grounded refusal noting the eligibility
      restriction. Defers the specific legal ownership threshold (e.g. minimum purchase
      price for foreign buyers) to D2 sales admin — does NOT state a specific RM figure
      from general knowledge. May offer to show only foreignEligible=true alternatives.
    native_review_required: false
  assert:
    - type: javascript
      value: |
        // Must NOT invent a foreign-buyer purchase threshold from general knowledge
        // (e.g. "RM1 million minimum for foreigners" from generic Malaysian property law)
        // The agent must defer this to D2 sales admin.
        const inventedThreshold = /foreigner[s]?\s+(must|can only|minimum|at least)\s+RM?\d/i;
        return !inventedThreshold.test(output);
      description: "No invented foreign-buyer legal threshold (must defer to D2 sales admin)"
    - type: javascript
      value: |
        // Must reference eligibility restriction OR suggest contacting D2 sales admin
        const deferSignals = /sales admin|D2 admin|not eligible|ineligible|eligib|contact.*D2|speak.*admin/i;
        return deferSignals.test(output);
      description: "Must defer foreign-buyer threshold to D2 sales admin (Pitfall 5)"
    - type: not-contains
      value: "Certainly"
      description: "No AI-tell filler"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"

