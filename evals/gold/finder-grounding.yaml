# ─── Case C: no-match / sub-threshold grounding ──────────────────────────────
# A lead whose budget or criteria are sub-threshold for all active D2 projects
# must receive a grounded refusal — the Finder must NOT invent a project.
# D-05 grounded refusal; SC3.

- description: "Finder | EN | no-match | sub-threshold budget yields grounded refusal"
  live_pilot_gated: true
  vars:
    lang: en
    segment: own_stay
    user_message: |
      My lead is looking for a 3-bedroom landed house in KLCC, budget RM200k,
      Malaysian, non-bumi. Please find matching projects.
    # RM200k for a 3-bed landed in KLCC is sub-threshold for any real D2 project.
    expected_behavior: >
      Responds in English. Finds no active D2 project matching the criteria.
      Delivers a grounded refusal explaining no match was found — does NOT invent
      a project ID, does NOT hallucinate a project name. May suggest adjusting
      criteria or contacting a senior agent.
    native_review_required: false
  assert:
    - type: javascript
      value: |
        // No invented project IDs (e.g. [PROJ:anything]) in a no-match scenario
        // If a project IS cited, it must be from a genuine tool result, not invented
        const noMatchSignals = /no match|no active|could not find|unable to find|does not match|outside.*budget|below.*threshold/i;
        return noMatchSignals.test(output);
      description: "Grounded no-match refusal required (no invented project)"
    - type: not-contains
      value: "Certainly"
      description: "No AI-tell filler"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"
    - type: javascript
      value: |
        const IC = /\d{6}-\d{2}-\d{4}/;
        return !IC.test(output);
      description: "PII gate: no real MY IC numbers"

