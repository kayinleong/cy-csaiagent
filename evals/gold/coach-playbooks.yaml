# ─── Case 2: First Meta-ad walkthrough (COACH-08) ────────────────────────────
# Step-by-step walkthrough of setting up the first Meta ad campaign for a D2 project.
# The Coach must walk through this from KB content — never from generic Meta Ads knowledge.

- description: "Coach | EN | playbooks | first-Meta-ad walkthrough step 1"
  vars:
    lang: en
    user_message: "I want to run my first Meta ad for a D2 project. Where do I start?"
    # Expected: Coach retrieves the first-Meta-ad walkthrough KB doc and begins
    # step 1. Must NOT provide generic FB Ads Manager instructions.
    expected_behavior: >
      Responds in English; cites the first-Meta-ad walkthrough KB chunk for step 1;
      does NOT invent Facebook Ads Manager steps not from D2 KB.
    native_review_required: false
  assert:
    - type: contains
      value: "KB:"
      description: "Response must cite at least one D2 KB chunk (Meta-ad walkthrough)"
    - type: not-contains
      value: "Certainly"
      description: "No AI-tell filler"
    - type: javascript
      value: |
        // Must not invent a budget figure not from D2 KB (hallucination sentinel)
        // A real budget figure pattern: RM 500, RM500, RM 1000, etc.
        // We check that any RM figure is paired with a KB citation — we can only
        // do a structural check here (live hallucination check is the llm-rubric domain).
        // Structural check: no unqualified "minimum" budget claim without KB cite.
        const hasBudgetClaim = /minimum.{0,20}RM|RM.{0,20}minimum/i.test(output);
        const hasKBCite = /KB:/.test(output);
        // If the response makes a budget claim, it MUST have a KB cite
        return hasBudgetClaim ? hasKBCite : true;
      description: "Any budget figure must be paired with a KB citation (hallucination guard)"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "No real MY phone numbers in output (PII gate)"

