# ─── Case D: Manual-override chip (wins over all heuristics) ─────────────────
# When the UI sends an explicit override, routeAsync must honor it regardless of content.

- description: "Router | EN | manual-override | Finder override wins despite Coach content"
  live_pilot_gated: true
  vars:
    lang: en
    expected_pillar: finder
    user_message: "Tell me about the D2 onboarding journey."
    # NOTE: this test requires the E2E setup to send x-pillar-override: finder header
    # or the equivalent override param. The online scaffold documents this.
    expected_behavior: >
      Despite the Coach-looking content ("onboarding journey"), if the UI sends a
      Finder manual override, the response should come from the Finder pillar
      (clarifying question or search result). This tests the override chip wins.
    native_review_required: false
  assert:
    - type: javascript
      value: |
        // With Finder override: response should be in Finder register (asking for criteria)
        // OR show a no-match if criteria not provided
        const finderOverrideSignal = /lead|criteria|match|project|budget|RM|no match|please provide|what.*lead/i;
        return finderOverrideSignal.test(output);
      description: "Finder override: response in Finder register despite Coach-content message"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"
