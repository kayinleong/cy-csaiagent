# ─── Case C: Ambiguous → safe default (Coach) ─────────────────────────────────
# Ambiguous messages that don't clearly map to either pillar must default to Coach
# (Pitfall 2 / D-01: low-confidence → 'coach' safe default).

- description: "Router | EN | ambiguous→coach | generic help message defaults to Coach"
  live_pilot_gated: true
  vars:
    lang: en
    expected_pillar: coach
    user_message: "Can you help me with something?"
    expected_behavior: >
      Ambiguous message — no pillar keyword. Router defaults to Coach (safe default,
      D-01 / Pitfall 2). Responds in English with a general Coach response asking for
      clarification or offering onboarding help. Does NOT show property match cards.
  assert:
    - type: javascript
      value: |
        // Ambiguous → Coach safe default: response should be clarifying or coaching
        // Not a property match response (no match cards, no RM prices for leads)
        const finderResponse = /\[PROJ:[a-z0-9-]+\]|matching projects|no match found/i;
        return !finderResponse.test(output);
      description: "Ambiguous defaults to Coach: no Finder match card in response"
    - type: not-contains
      value: "Certainly"
      description: "No AI-tell filler"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"

- description: "Router | MS | ambiguous→coach | mesej tidak jelas lalai ke Coach"
  live_pilot_gated: true
  vars:
    lang: ms
    expected_pillar: coach
    user_message: "Boleh bantu saya dengan sesuatu?"
    expected_behavior: >
      Ambiguous message in BM. Defaults to Coach. Response in BM offers clarification
      or onboarding help. No property match content.
    native_review_required: true
    native_review_status: "PENDING — requires native BM speaker review"
  assert:
    - type: javascript
      value: |
        const bmIndicators = /\b(dan|atau|untuk|dalam|boleh|ya|anda|saya|tolong)\b/i;
        return bmIndicators.test(output);
