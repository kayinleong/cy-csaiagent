# evals/gold/router-precision.yaml — Router precision gold set (Phase 3, FIND-11)
#
# Covers: Coach vs Finder routing accuracy across EN / BM / ZH (FIND-11, SC5).
#
# Case categories:
#   (a) Clear Coach — onboarding, training, journey, playbook, escalation messages.
#       Expected: routeAsync returns pillar='coach'.
#   (b) Clear Finder — paste criteria, lead details, property match, budget messages.
#       Expected: routeAsync returns pillar='finder'.
#   (c) Ambiguous → safe default — messages that could be either pillar.
#       Expected: routeAsync defaults to 'coach' (low-confidence safe default, D-01/Pitfall 2).
#
# The router test sends messages to the /api/chat endpoint and asserts that:
#   - The response is in the correct pillar register (Coach tone vs Finder match cards)
#   - The routeDecision (recorded in the response or as a header — D-02) matches the label
#
# IMPORTANT: The offline assertion uses response language + content signals to approximate
# routing correctness. The live Opus judge asserts that the response pillar matches the label.
#
# All prompts SYNTHETIC — no real PII.
# Run gate: LIVE-PILOT-GATED (requires live intent classifier + judge).
#
# Reference: FIND-11, D-01/D-02, Pitfall 2, 03-09-PLAN.md Task 1,
#            src/router/index.ts routeAsync, src/router/heuristic.ts

# ─── Case A: Clear Coach messages ─────────────────────────────────────────────

- description: "Router | EN | clear-coach | onboarding question routes to Coach"
  live_pilot_gated: true
  vars:
    lang: en
    expected_pillar: coach
    user_message: "Hi, I just joined D2 today. Can you explain the onboarding journey to me?"
    expected_behavior: >
      Routes to Coach. Responds in English with D2 onboarding content.
      Does NOT show property match cards. Cites KB chunk.
  assert:
    - type: javascript
      value: |
        // Coach response: should cite a KB chunk (onboarding grounding)
        const coachSignal = /KB:|onboarding|journey|checkpoint|training|PowerBoost/i;
        return coachSignal.test(output);
      description: "Routed to Coach: response shows onboarding/training content"
    - type: javascript
      value: |
        // Must NOT show finder match-card patterns (project IDs / PROJ: tags)
        const finderSignal = /\[PROJ:[a-z0-9-]+\]|no match found|priceBand|own.?stay|investment/i;
        return !finderSignal.test(output);
      description: "Must NOT be routed to Finder for a clear Coach question"
    - type: not-contains
      value: "Certainly"
      description: "No AI-tell filler"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"

