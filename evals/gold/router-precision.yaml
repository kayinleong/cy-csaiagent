        const finderBM = /padanan projek|tiada padanan|RM.*bajet.*lead/i;
        return !finderBM.test(output);
      description: "Ambiguous defaults to Coach: no Finder content in BM response"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"

