# ─── Case B: Clear Finder messages ────────────────────────────────────────────

- description: "Router | EN | clear-finder | paste lead criteria routes to Finder"
  live_pilot_gated: true
  vars:
    lang: en
    expected_pillar: finder
    user_message: |
      Here's my lead: Malaysian, non-bumi, budget RM600k, looking for a 3-bedroom
      unit in Subang Jaya, own stay. Please find matching projects.
    expected_behavior: >
      Routes to Finder. Responds in English with property match cards or a grounded
      refusal. Does NOT show Coach onboarding content. Response includes property
      match information or a no-match explanation.
  assert:
    - type: javascript
      value: |
        // Finder response: match cards or grounded refusal signals
        const finderSignal = /match|project|RM|budget|bedroom|no match|grounded|no active|alternative|collateral/i;
        return finderSignal.test(output);
      description: "Routed to Finder: response shows property match or refusal"
    - type: javascript
      value: |
        // Must NOT respond with pure Coach onboarding content (no KB citations for training)
        // (A Finder response citing a project-grounding is OK — it's different from KB:chunk-id coaching)
        const coachOnly = /onboarding journey|PowerBoost|training checkpoint|comprehension gate/i;
        return !coachOnly.test(output);
      description: "Must NOT be routed to Coach for a clear Finder question"
    - type: javascript
      value: |
        const MY_PHONE = /\+?60\d{9,10}/;
        return !MY_PHONE.test(output);
      description: "PII gate: no real MY phone numbers"

